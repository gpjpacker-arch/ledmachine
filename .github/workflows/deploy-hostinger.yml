name: Deploy Automático para Hostinger via FTP

on:
  push:
    branches:
      - main # ou master (nome da sua branch principal)

jobs:
  build-and-deploy:
    name: Build e Deploy Automático
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🏗️ Gerar versão de produção (Build)
        run: npm run build

      - name: 🚀 Enviar arquivos para a Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}     # Ex: ftp.seudominio.com.br ou IP da Hostinger
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }} # Seu usuário FTP da Hostinger
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }} # Sua senha FTP da Hostinger
          local-dir: ./dist/                              # Pasta gerada pelo build
          server-dir: /public_html/                       # Pasta pública da Hostinger
          dangerous-clean-slate: false                    # Não apaga arquivos extras fora do build
